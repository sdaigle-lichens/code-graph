packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 spelling: `allowBuilds:` replaced pnpm 10's `onlyBuiltDependencies:` list, which pnpm 11
# no longer reads (electron and esbuild would skip their postinstall).
allowBuilds:
  # The desktop app; electron's postinstall downloads the platform binary.
  electron: true
  esbuild: true
overrides:
  code-graph: link:packages/code-graph
